<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your cart — ORBIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="dot"></span>ORBIT</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="products.html#Wearables">Wearables</a>
      <a href="products.html#Cameras">Cameras</a>
      <a href="products.html#Audio">Audio</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" title="Toggle dark mode">🌙</button>
      <a href="cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count>0</span></a>
      <button class="nav-toggle" aria-label="Menu"><span></span></button>
    </div>
  </div>
</header>

<section class="section" style="padding-top:36px;">
  <div class="wrap">
    <h1 style="font-size:2rem; margin-bottom:26px;">Your cart</h1>
    <div class="cart-layout">
      <div id="cart-list"></div>
      <aside class="summary-card">
        <h3 style="margin-bottom:16px;">Order summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="summary-shipping">—</span></div>
        <div class="summary-row total"><span>Total</span><span id="summary-total">₹0</span></div>
        <a href="order.html" class="btn btn-primary btn-block" style="margin-top:18px;" id="checkout-btn">Proceed to checkout</a>
        <p style="color:var(--muted); font-size:.78rem; margin-top:12px;">Free shipping on orders over ₹5,000.</p>
      </aside>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© <span data-year></span> ORBIT. Student project — not a real store.</span>
      <span>Made with HTML, CSS &amp; JavaScript</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
