<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — ORBIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="dot"></span>ORBIT</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="products.html#Wearables">Wearables</a>
      <a href="products.html#Cameras">Cameras</a>
      <a href="products.html#Audio">Audio</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" title="Toggle dark mode">🌙</button>
      <a href="cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count>0</span></a>
      <button class="nav-toggle" aria-label="Menu"><span></span></button>
    </div>
  </div>
</header>

<section class="section" id="success-content">
  <div class="wrap">
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <h1>Order placed!</h1>
      <p class="details-desc" style="margin:0 auto;">Thanks<span id="order-name-out-wrap">, <strong id="order-name-out"></strong></span> — your order is confirmed and on its way.</p>
      <div class="order-id-badge">Order #<span id="order-id"></span></div>

      <div class="order-summary-list">
        <div id="order-items-out"></div>
        <div class="summary-row total"><span>Total paid</span><span id="order-total-out">₹0</span></div>
        <div class="mini-item" style="margin-top:10px;"><span>Delivering to</span><span id="order-address-out" style="text-align:right; max-width:60%;"></span></div>
        <div class="mini-item"><span>Payment mode</span><span id="order-payment-out"></span></div>
      </div>

      <a href="products.html" class="btn btn-dark">Continue shopping</a>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© <span data-year></span> ORBIT. Student project — not a real store.</span>
      <span>Made with HTML, CSS &amp; JavaScript</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
